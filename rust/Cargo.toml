[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Joseph Schlesinger <joe@schlesinger.io>"]
repository = "https://github.com/roboalchemist/any2md"

[workspace.dependencies]
any2md-mlx = { path = "crates/any2md-mlx" }
any2md-hub = { path = "crates/any2md-hub" }
any2md-models = { path = "crates/any2md-models" }

mlx-rs = { version = "0.32", features = ["metal", "safetensors"] }
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
ureq = "3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hound = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
